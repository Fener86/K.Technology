name: Scoperta settimanale novita' vendor

on:
  schedule:
    # Ogni lunedi' alle 05:00 UTC
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Esegui scoperta novita' vendor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/discover-updates.mjs

      - name: Commit ed eventuale push del risultato
        run: |
          git config user.name "kaplet-discovery-bot"
          git config user.email "kaplet-discovery-bot@users.noreply.github.com"
          git add data/catalog.json data/proposals.json
          if git diff --cached --quiet; then
            echo "Nessuna novita' da committare."
          else
            git commit -m "chore: scoperta automatica novita' vendor $(date -u +%F)"
            git push
          fi
