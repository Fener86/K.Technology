<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kaplet Technology Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0B0F14; --panel: #121922; --panel-2: #171F29; --border: #232E39; --border-strong: #34424F;
  --text: #E7EDF3; --text-dim: #8FA0AC; --text-faint: #5C6B77; --accent: #4FD8C4; --accent-dim: #2A5F58;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text);
  background-image: linear-gradient(rgba(79,216,196,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(79,216,196,0.035) 1px, transparent 1px);
  background-size: 32px 32px; }
.mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
a { color: var(--accent); }
header.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 20px; padding: 14px 24px;
  background: rgba(11,15,20,0.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
.logo { display: flex; flex-direction: column; line-height: 1.1; cursor: pointer; }
.logo-main { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.5px; }
.logo-sub { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; }
.search-box { flex: 1; max-width: 480px; }
.search-box input { width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 9px 14px; border-radius: 4px; font-size: 13px; outline: none; }
.search-box input:focus { border-color: var(--accent); }
nav.top-nav { display: flex; gap: 4px; margin-left: auto; }
nav.top-nav button { background: transparent; border: 1px solid transparent; color: var(--text-dim); padding: 8px 14px; font-size: 12px;
  letter-spacing: 0.5px; text-transform: uppercase; font-family: 'IBM Plex Mono', monospace; cursor: pointer; border-radius: 4px; }
nav.top-nav button:hover { color: var(--text); border-color: var(--border); }
nav.top-nav button.active { color: var(--accent); border-color: var(--accent-dim); background: rgba(79,216,196,0.06); }
.body-layout { display: flex; max-width: 1320px; margin: 0 auto; }
.sidebar { width: 220px; flex-shrink: 0; padding: 24px 16px; border-right: 1px solid var(--border); min-height: calc(100vh - 60px); }
.sidebar-title { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 2px; color: var(--text-faint); text-transform: uppercase; margin-bottom: 12px; }
.sidebar-item { display: flex; justify-content: space-between; padding: 9px 10px; border-radius: 4px; cursor: pointer; font-size: 13px;
  color: var(--text-dim); margin-bottom: 2px; border-left: 2px solid transparent; }
.sidebar-item:hover { background: var(--panel); color: var(--text); }
.sidebar-item.active { background: var(--panel-2); color: var(--accent); border-left-color: var(--accent); }
.sidebar-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-faint); }
main.content { flex: 1; padding: 28px 32px; min-width: 0; }
.breadcrumb { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-faint); margin-bottom: 18px; }
.breadcrumb span.seg { color: var(--text-dim); cursor: pointer; }
.breadcrumb span.seg:hover { color: var(--accent); }
.breadcrumb span.sep { color: var(--border-strong); margin: 0 6px; }
h1.h1 { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; margin: 0 0 6px; }
h2.h2 { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; margin: 28px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.desc { color: var(--text-dim); font-size: 14px; line-height: 1.6; max-width: 720px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-top: 16px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; cursor: pointer; transition: border-color 0.15s; }
.card:hover { border-color: var(--accent-dim); }
.card-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.card-meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-faint); margin-bottom: 8px; }
.card-desc { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
.led { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.led-verificare { border: 1px dashed #8D8AC9; width: 6px; height: 6px; background: transparent !important; }
.badge { display: inline-flex; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; padding: 3px 8px; border-radius: 3px; letter-spacing: 0.3px; text-transform: uppercase; }
.field-row { display: grid; grid-template-columns: 200px 1fr; gap: 4px 16px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.field-label { color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 20px; margin-bottom: 16px; }
.source-tag { display: inline-flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--accent);
  border: 1px solid var(--accent-dim); padding: 4px 9px; border-radius: 3px; margin-top: 6px; text-decoration: none; }
.source-tag:hover { background: rgba(79,216,196,0.08); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 12px; }
table.tbl th { text-align: left; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--text-faint); padding: 8px 10px; border-bottom: 1px solid var(--border-strong); }
table.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
table.tbl tr[data-nav]:hover td { background: rgba(255,255,255,0.02); cursor: pointer; }
input.inp, select.inp, textarea.inp { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  padding: 8px 10px; border-radius: 4px; font-size: 13px; outline: none; font-family: inherit; }
input.inp:focus, select.inp:focus, textarea.inp:focus { border-color: var(--accent); }
label.lbl { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-faint); margin-bottom: 4px; display: block; }
.form-row { margin-bottom: 12px; }
.btn { background: var(--accent); color: #05201C; border: none; padding: 9px 18px; border-radius: 4px; font-size: 12.5px; font-weight: 600;
  cursor: pointer; font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.3px; }
.btn:hover { filter: brightness(1.08); }
.btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border-strong); padding: 8px 16px; border-radius: 4px;
  font-size: 12.5px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; }
.btn-ghost:hover { color: var(--text); border-color: var(--accent-dim); }
.btn-danger { background: transparent; color: #E5484D; border: 1px solid #5A2A2C; padding: 5px 10px; border-radius: 4px; font-size: 11px;
  cursor: pointer; font-family: 'IBM Plex Mono', monospace; }
.btn-danger:hover { background: rgba(229,72,77,0.08); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 18px; flex-wrap: wrap; }
.tab { padding: 9px 16px; font-size: 12.5px; font-family: 'IBM Plex Mono', monospace; color: var(--text-faint); cursor: pointer; border-bottom: 2px solid transparent; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.empty { color: var(--text-faint); font-size: 13px; padding: 24px; text-align: center; border: 1px dashed var(--border-strong); border-radius: 6px; }
.hint { font-size: 11px; color: var(--text-faint); margin-top: 4px; }
.assistant-panel { position: fixed; right: 0; top: 0; bottom: 0; width: 400px; max-width: 92vw; background: var(--panel);
  border-left: 1px solid var(--border-strong); z-index: 50; display: none; flex-direction: column; box-shadow: -12px 0 32px rgba(0,0,0,0.4); }
.assistant-panel.open { display: flex; }
.assistant-header { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.assistant-msgs { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.msg-user { align-self: flex-end; background: var(--accent-dim); color: var(--text); padding: 9px 13px; border-radius: 8px 8px 2px 8px; font-size: 13px; max-width: 85%; }
.msg-bot { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 10px 13px;
  border-radius: 8px 8px 8px 2px; font-size: 13px; max-width: 92%; white-space: pre-wrap; line-height: 1.55; }
.assistant-input { padding: 14px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
.assistant-input textarea { flex: 1; resize: none; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--accent-dim);
  color: var(--text); padding: 10px 20px; border-radius: 6px; font-size: 12.5px; z-index: 100; font-family: 'IBM Plex Mono', monospace; display: none; }
.fab { position: fixed; bottom: 24px; right: 24px; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #05201C;
  border: none; font-size: 20px; cursor: pointer; z-index: 40; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }
.gh-status { display: inline-flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 4px 10px; border-radius: 3px; }
.gh-status.ok { color: #4CC38A; border: 1px solid #2c5c40; background: rgba(76,195,138,0.08); }
.gh-status.off { color: var(--text-faint); border: 1px solid var(--border-strong); }
</style>
</head>
<body>

<header class="top">
  <div class="logo" data-nav="#/"><div class="logo-main">KAPLET</div><div class="logo-sub">Technology Portfolio</div></div>
  <div class="search-box"><input id="search-input" placeholder="Cerca vendor, famiglia, prodotto, licenza..." /></div>
  <nav class="top-nav" id="top-nav">
    <button data-nav="#/">Home</button>
    <button data-nav="#/matrix">Matrici</button>
    <button data-nav="#/settings">Impostazioni</button>
    <button data-nav="#/admin/vendor">Admin</button>
  </nav>
</header>

<div class="body-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content" id="content"></main>
</div>

<button class="fab" id="fab-assistant" title="Apri assistente">&#9993;</button>

<div class="assistant-panel" id="assistant-panel">
  <div class="assistant-header">
    <div>
      <div style="font-weight:600;font-size:13px;">Assistente catalogo</div>
      <div class="hint">Risponde solo con dati verificati nel catalogo</div>
    </div>
    <button class="btn-ghost" id="close-assistant">Chiudi</button>
  </div>
  <div class="assistant-msgs" id="assistant-msgs"></div>
  <div class="assistant-input">
    <textarea class="inp" id="assistant-input" rows="2" placeholder="Es: Che supporto ha FortiGate?"></textarea>
    <button class="btn" id="send-assistant">Invia</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   KAPLET TECHNOLOGY PORTFOLIO — pagina HTML autonoma
   Persistenza: GitHub (repo configurato in Impostazioni) con fallback
   locale (localStorage) quando nessun repo e' collegato.
   Monitoraggio fonti: legge data/source-status.json, aggiornato ogni
   giorno da GitHub Actions (vedi .github/workflows/daily-source-check.yml).
   ============================================================ */

const LS_CATALOG = "kaplet_catalog_cache_v1";
const LS_GH = "kaplet_gh_config_v1";
const LS_APIKEY = "kaplet_anthropic_key_v1";

function uid(p){ return p + "_" + Math.random().toString(36).slice(2,9); }

/* ---- fallback dataset (usato se data/catalog.json non e' raggiungibile, es. file:// locale) ---- */
const EMBEDDED_CATALOG_URL = "data/catalog.json";
const EMBEDDED_STATUS_URL = "data/source-status.json";

const STATO_META = {
  attivo: { label: "Attivo", color: "#4CC38A" },
  nuovo: { label: "Nuovo", color: "#4FD8C4" },
  legacy: { label: "Legacy", color: "#E8A33D" },
  end_of_sale: { label: "End-of-Sale", color: "#E8A33D" },
  end_of_life: { label: "End-of-Life", color: "#E5484D" },
  end_of_support: { label: "End-of-Support", color: "#E5484D" },
  sostituito: { label: "Sostituito", color: "#E5484D" },
  da_verificare: { label: "Da verificare", color: "#8D8AC9" },
};
const FEATURE_STATO_META = {
  incluso: { label: "Incluso", color: "#4CC38A" },
  non_incluso: { label: "Non incluso", color: "#5A6672" },
  opzionale: { label: "Opzionale", color: "#4FD8C4" },
  richiede_addon: { label: "Richiede add-on", color: "#E8A33D" },
  richiede_subscription: { label: "Richiede subscription", color: "#E8A33D" },
  dipende_versione: { label: "Dipende versione", color: "#8D8AC9" },
  limitato: { label: "Limitato", color: "#E8A33D" },
  da_verificare: { label: "Da verificare", color: "#8D8AC9" },
};

let state = {
  catalog: null,
  sourceStatus: null,
  ghConfig: JSON.parse(localStorage.getItem(LS_GH) || "null") || { owner: "", repo: "", branch: "main", token: "" },
  ghSha: null, // sha del file catalog.json su GitHub, necessario per aggiornarlo
  apiKey: localStorage.getItem(LS_APIKEY) || "",
  query: "",
  assistantMsgs: [
    { role: "bot", text: "Ciao, sono l'assistente del catalogo Kaplet. Chiedimi ad esempio: \"Che supporto ha FortiGate?\" oppure \"Il Catalyst 9300 si gestisce da Meraki?\". Rispondo solo con i dati verificati presenti nel catalogo." }
  ],
};

/* ---------------- caricamento iniziale ---------------- */

async function loadInitialData() {
  // 1) se e' configurato un repo GitHub, prova a leggere la versione piu' aggiornata da li'
  if (state.ghConfig.owner && state.ghConfig.repo) {
    try {
      const file = await ghGetFile("data/catalog.json");
      if (file) { state.catalog = file.json; state.ghSha = file.sha; }
    } catch (e) { /* fallback sotto */ }
  }
  // 2) altrimenti prova il file statico servito insieme alla pagina (funziona su GitHub Pages / server http)
  if (!state.catalog) {
    try {
      const res = await fetch(EMBEDDED_CATALOG_URL, { cache: "no-store" });
      if (res.ok) state.catalog = await res.json();
    } catch (e) { /* fallback sotto */ }
  }
  // 3) altrimenti usa la cache locale del browser
  if (!state.catalog) {
    const cached = localStorage.getItem(LS_CATALOG);
    if (cached) state.catalog = JSON.parse(cached);
  }
  if (!state.catalog) {
    showToast("Impossibile caricare data/catalog.json: apri la pagina da un server http (es. GitHub Pages) oppure configura un repository in Impostazioni.");
    state.catalog = { macroaree: [], areeFunzionali: [], vendors: [], brandLines: [], famiglie: [], prodotti: [], licenze: [], licenseFeatures: [], integrazioni: [], fonti: [], changelog: [] };
  }
  localStorage.setItem(LS_CATALOG, JSON.stringify(state.catalog));

  try {
    const res = await fetch(EMBEDDED_STATUS_URL, { cache: "no-store" });
    if (res.ok) state.sourceStatus = await res.json();
  } catch (e) {}
  if (!state.sourceStatus) state.sourceStatus = { ultimaEsecuzione: null, risultati: {} };
}

/* ---------------- GitHub Contents API ---------------- */

function b64encode(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64decode(b64) { return decodeURIComponent(escape(atob(b64))); }

async function ghGetFile(path) {
  const { owner, repo, branch, token } = state.ghConfig;
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${encodeURIComponent(branch || "main")}`;
  const headers = { Accept: "application/vnd.github+json" };
  if (token) headers.Authorization = `token ${token}`;
  const res = await fetch(url, { headers });
  if (!res.ok) throw new Error("GitHub GET " + path + " -> " + res.status);
  const data = await res.json();
  return { json: JSON.parse(b64decode(data.content.replace(/\n/g, ""))), sha: data.sha };
}

async function ghPutFile(path, obj, sha, message) {
  const { owner, repo, branch, token } = state.ghConfig;
  if (!token) throw new Error("Nessun token GitHub configurato: le modifiche restano solo locali.");
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
  const body = {
    message: message || "chore: aggiornamento catalogo da Kaplet Technology Portfolio",
    content: b64encode(JSON.stringify(obj, null, 2)),
    branch: branch || "main",
  };
  if (sha) body.sha = sha;
  const res = await fetch(url, {
    method: "PUT",
    headers: { Authorization: `token ${token}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) { const t = await res.text(); throw new Error("GitHub PUT fallita: " + res.status + " " + t); }
  const data = await res.json();
  return data.content.sha;
}

async function persistCatalog(nextCatalog, changeLabel) {
  state.catalog = nextCatalog;
  localStorage.setItem(LS_CATALOG, JSON.stringify(state.catalog));
  if (state.ghConfig.owner && state.ghConfig.repo && state.ghConfig.token) {
    try {
      const newSha = await ghPutFile("data/catalog.json", nextCatalog, state.ghSha, "chore: " + (changeLabel || "modifica catalogo"));
      state.ghSha = newSha;
      showToast("Salvato su GitHub (" + state.ghConfig.owner + "/" + state.ghConfig.repo + ").");
    } catch (e) {
      showToast("Salvato solo in locale — errore GitHub: " + e.message);
    }
  } else {
    showToast("Salvato solo in locale (nessun repository GitHub collegato). Vai in Impostazioni per condividerlo.");
  }
  render();
}

function logChange(cat, entita, azione, nome) {
  cat.changelog = cat.changelog || [];
  cat.changelog.push({ id: uid("chg"), entita, azione, nome, timestamp: new Date().toISOString() });
  return cat;
}

/* ---------------- toast ---------------- */
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = "none"; }, 3200);
}

/* ---------------- lookups ---------------- */
function byIdMap(arr) { const m = {}; (arr || []).forEach((x) => (m[x.id] = x)); return m; }
function lookups() {
  const c = state.catalog;
  return {
    macroaree: byIdMap(c.macroaree), areeFunzionali: byIdMap(c.areeFunzionali), vendors: byIdMap(c.vendors),
    brandLines: byIdMap(c.brandLines), famiglie: byIdMap(c.famiglie), prodotti: byIdMap(c.prodotti),
    licenze: byIdMap(c.licenze), fonti: byIdMap(c.fonti),
  };
}

/* ---------------- small render helpers ---------------- */
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, (c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function led(status){ const m = STATO_META[status] || STATO_META.da_verificare; if(status==="da_verificare") return `<span class="led led-verificare" title="${m.label}"></span>`; return `<span class="led" style="background:${m.color};box-shadow:0 0 6px ${m.color}55" title="${m.label}"></span>`; }
function badge(status){ const m = STATO_META[status] || STATO_META.da_verificare; return `<span class="badge" style="color:${m.color};border:1px solid ${m.color}55;background:${m.color}14">${led(status)}${m.label}</span>`; }
function featureBadge(stato, nota){ const m = FEATURE_STATO_META[stato] || FEATURE_STATO_META.da_verificare; return `<span class="badge" title="${esc(nota||"")}" style="color:${m.color};border:1px solid ${m.color}55;background:${m.color}14">${m.label}</span>`; }
function sourceTag(fonte){ if(!fonte) return `<span class="hint">DA VERIFICARE CON IL VENDOR</span>`; return `<a class="source-tag" href="${esc(fonte.url)}" target="_blank" rel="noopener noreferrer">&#8599; ${esc(fonte.titolo)} &middot; verificato ${esc(fonte.dataConsultazione)}</a>`; }
function breadcrumb(items){ return `<div class="breadcrumb">${items.map((it,i)=> (i>0?'<span class="sep">/</span>':'') + `<span class="seg" data-nav="${it.hash||''}">${esc(it.label||'')}</span>`).join("")}</div>`; }

/* ---------------- router ---------------- */
function parseHash() {
  const h = (location.hash || "#/").replace(/^#\//, "");
  const parts = h.split("/").filter(Boolean);
  return { page: parts[0] || "home", p1: parts[1], p2: parts[2] };
}

function nav(hash){ location.hash = hash; }

window.addEventListener("hashchange", render);

/* ---------------- main render ---------------- */

function render() {
  const { page, p1, p2 } = parseHash();
  document.querySelectorAll("#top-nav button").forEach((b) => b.classList.remove("active"));
  const activeBtn = document.querySelector(`#top-nav button[data-nav="#/${page==="home"?"":page}"]`);
  renderSidebar(page, p1);
  const content = document.getElementById("content");

  const L = lookups();
  const c = state.catalog;

  if (page === "home") content.innerHTML = viewHome(c);
  else if (page === "macroarea") content.innerHTML = viewMacroarea(L.macroaree[p1], c, L);
  else if (page === "vendor") content.innerHTML = viewVendor(L.vendors[p1], c, L);
  else if (page === "family") content.innerHTML = viewFamily(L.famiglie[p1], c, L);
  else if (page === "product") content.innerHTML = viewProduct(L.prodotti[p1], c, L);
  else if (page === "license") content.innerHTML = viewLicense(L.licenze[p1], c, L);
  else if (page === "matrix") content.innerHTML = viewMatrix(c, L, p1);
  else if (page === "search") content.innerHTML = viewSearch(state.query, c, L);
  else if (page === "settings") content.innerHTML = viewSettings();
  else if (page === "admin") content.innerHTML = viewAdmin(p1 || "vendor", c);
  else content.innerHTML = `<div class="empty">Pagina non trovata.</div>`;

  bindNavClicks();
  if (page === "admin") bindAdminHandlers(p1 || "vendor");
  if (page === "settings") bindSettingsHandlers();
  if (page === "matrix") bindMatrixHandlers();
}

function bindNavClicks() {
  document.querySelectorAll("[data-nav]").forEach((el) => {
    el.onclick = (e) => { e.preventDefault(); nav(el.getAttribute("data-nav")); };
  });
}

function renderMonitorSummary() {
  const s = state.sourceStatus;
  if (!s || !s.ultimaEsecuzione) return `<div class="empty">Nessun controllo automatico eseguito ancora. Si attivera' con il primo run di GitHub Actions (vedi Impostazioni).</div>`;
  const risultati = Object.values(s.risultati || {});
  const cambiate = risultati.filter((r) => r.cambiataDaUltimoControllo);
  const irraggiungibili = risultati.filter((r) => !r.raggiungibile);
  return `
    <div class="hint" style="margin-bottom:10px;">Ultimo controllo automatico: ${new Date(s.ultimaEsecuzione).toLocaleString("it-IT")}</div>
    <div>${risultati.length} fonti monitorate — <span style="color:${cambiate.length?'#E8A33D':'#4CC38A'}">${cambiate.length} variate</span>, <span style="color:${irraggiungibili.length?'#E5484D':'#4CC38A'}">${irraggiungibili.length} non raggiungibili</span></div>
    ${cambiate.length ? `<div style="margin-top:10px;">${cambiate.map(r=>`<div class="hint">&#9888; <a href="${esc(r.url)}" target="_blank">${esc(r.url)}</a> — cambiata dall'ultimo controllo, da rivedere</div>`).join("")}</div>` : ""}
  `;
}

function viewMatrix(c, L, familyIdParam) {

  const licenze = c.licenze.filter((l) => l.familyId === familyId);
  const featureNomi = [...new Set(c.licenseFeatures.filter((lf) => licenze.some((l) => l.id === lf.licenseId)).map((lf) => lf.featureNome))];
  return `

  `;
}
function bindMatrixHandlers(){
  const sel = document.getElementById("matrix-family-select");
  if (sel) sel.onchange = () => nav("#/matrix/" + sel.value);
}

function viewSearch(query, c, L) {
  const q = (query || "").toLowerCase();
  const match = (s) => (s||"").toLowerCase().includes(q);
  const res = {
    vendors: c.vendors.filter(v=>match(v.nome)),
    famiglie: c.famiglie.filter(f=>match(f.nome)||match(f.descrizione)),
    prodotti: c.prodotti.filter(p=>match(p.nomeCommerciale)||match(p.descrizioneBreve)),
    licenze: c.licenze.filter(l=>match(l.nomeUfficiale)),
  };
  const total = res.vendors.length+res.famiglie.length+res.prodotti.length+res.licenze.length;
  return `
    <h1 class="h1">Risultati per "${esc(query)}"</h1>
    <div class="desc">${total} risultati</div>
    ${total===0?`<div class="empty">Nessun risultato. Prova un altro termine o aggiungi il dato mancante dal pannello Admin.</div>`:""}
    ${res.vendors.length?`<h2 class="h2">Vendor</h2><div class="grid">${res.vendors.map(v=>`<div class="card" data-nav="#/vendor/${v.id}"><div class="card-title">${esc(v.nome)}</div></div>`).join("")}</div>`:""}
    ${res.famiglie.length?`<h2 class="h2">Famiglie</h2><div class="grid">${res.famiglie.map(f=>`<div class="card" data-nav="#/family/${f.id}"><div class="card-title">${led(f.stato)}${esc(f.nome)}</div><div class="card-meta">${esc(L.vendors[f.vendorId]?.nome||"")}</div></div>`).join("")}</div>`:""}
    ${res.prodotti.length?`<h2 class="h2">Prodotti</h2><div class="grid">${res.prodotti.map(p=>`<div class="card" data-nav="#/product/${p.id}"><div class="card-title">${led(p.statoLifecycle)}${esc(p.nomeCommerciale)}</div></div>`).join("")}</div>`:""}
    ${res.licenze.length?`<h2 class="h2">Licenze</h2><div class="grid">${res.licenze.map(l=>`<div class="card" data-nav="#/license/${l.id}"><div class="card-title">${esc(l.nomeUfficiale)}</div></div>`).join("")}</div>`:""}
  `;
}

/* ---------------- settings (GitHub + assistente + monitor) ---------------- */

function viewSettings() {
  const gh = state.ghConfig;
  const connected = !!(gh.owner && gh.repo && gh.token);
  return `
    <h1 class="h1">Impostazioni</h1>
    <div class="desc">Collega un repository GitHub per rendere condivise le modifiche del pannello Admin e per abilitare il controllo automatico giornaliero delle fonti (tramite GitHub Actions gia' incluso nel repository).</div>

    <h2 class="h2">Repository GitHub</h2>
    <div class="panel">
      <div class="gh-status ${connected?'ok':'off'}" style="margin-bottom:14px;">${connected?'&#9679; Collegato: '+esc(gh.owner)+'/'+esc(gh.repo)+' ('+esc(gh.branch||'main')+')':'&#9675; Non collegato — modifiche salvate solo in locale'}</div>
      <div class="grid3">
        <div class="form-row"><label class="lbl">Proprietario (owner)</label><input class="inp" id="gh-owner" value="${esc(gh.owner)}" placeholder="es. kaplet" /></div>
        <div class="form-row"><label class="lbl">Repository</label><input class="inp" id="gh-repo" value="${esc(gh.repo)}" placeholder="es. technology-portfolio" /></div>
        <div class="form-row"><label class="lbl">Branch</label><input class="inp" id="gh-branch" value="${esc(gh.branch||'main')}" placeholder="main" /></div>
      </div>
      <div class="form-row"><label class="lbl">Personal Access Token (fine-grained, permesso "Contents: read/write" solo su questo repo)</label>
        <input class="inp" type="password" id="gh-token" value="${esc(gh.token)}" placeholder="ghp_..." />
        <div class="hint">Il token resta solo nel tuo browser (localStorage) e viene usato solo per chiamare api.github.com. Non condividerlo, e crealo con permessi limitati al solo repo del catalogo.</div>
      </div>
      <button class="btn" id="gh-save">Salva e connetti</button>
      <button class="btn-ghost" id="gh-clear" style="margin-left:8px;">Scollega</button>
    </div>

    <h2 class="h2">Come funziona il controllo giornaliero</h2>
    <div class="panel desc">
      Nel repository e' incluso <code>.github/workflows/daily-source-check.yml</code>: una volta che pubblichi il repo su GitHub
      (anche gratuito), GitHub esegue ogni giorno lo script <code>scripts/check-sources.mjs</code>, che verifica la
      raggiungibilita' di ogni fonte ufficiale registrata e rileva se il contenuto e' cambiato dall'ultima esecuzione,
      aggiornando <code>data/source-status.json</code>. Questa pagina legge quel file e mostra l'esito in Home.
      Non sostituisce una rilettura umana del contenuto: segnala solo "qualcosa e' cambiato, vai a controllare".
    </div>

    <h2 class="h2">Assistente — modalita' avanzata (opzionale)</h2>
    <div class="panel">
      <div class="desc" style="margin-bottom:10px;">Senza chiave, l'assistente risponde comunque con una ricerca strutturata sui dati del catalogo.
      Se incolli qui una tua API key Anthropic, le risposte saranno generate in linguaggio naturale da Claude, sempre vincolate ai soli dati del catalogo.
      La chiave resta solo nel tuo browser e viene inviata direttamente ad Anthropic: non pubblicare questa pagina su un sito pubblico se non vuoi che la chiave sia visibile nelle richieste di rete del tuo browser.</div>
      <div class="form-row"><label class="lbl">Anthropic API key</label><input class="inp" type="password" id="anthropic-key" value="${esc(state.apiKey)}" placeholder="sk-ant-..." /></div>
      <button class="btn" id="save-apikey">Salva chiave</button>
      <button class="btn-ghost" id="clear-apikey" style="margin-left:8px;">Rimuovi</button>
    </div>
  `;
}

function bindSettingsHandlers() {
  document.getElementById("gh-save").onclick = () => {
    state.ghConfig = {
      owner: document.getElementById("gh-owner").value.trim(),
      repo: document.getElementById("gh-repo").value.trim(),
      branch: document.getElementById("gh-branch").value.trim() || "main",
      token: document.getElementById("gh-token").value.trim(),
    };
    localStorage.setItem(LS_GH, JSON.stringify(state.ghConfig));
    showToast("Configurazione GitHub salvata. Ricarico il catalogo dal repository...");
    loadInitialData().then(render);
  };
  document.getElementById("gh-clear").onclick = () => {
    state.ghConfig = { owner: "", repo: "", branch: "main", token: "" };
    localStorage.removeItem(LS_GH);
    showToast("Repository scollegato.");
    render();
  };
  document.getElementById("save-apikey").onclick = () => {
    state.apiKey = document.getElementById("anthropic-key").value.trim();
    localStorage.setItem(LS_APIKEY, state.apiKey);
    showToast("Chiave salvata nel browser.");
  };
  document.getElementById("clear-apikey").onclick = () => {
    state.apiKey = ""; localStorage.removeItem(LS_APIKEY);
    document.getElementById("anthropic-key").value = "";
    showToast("Chiave rimossa.");
  };
}

function viewAdmin(tab, c) {

function bindAdminHandlers(tab) {
  document.querySelectorAll("[data-del]").forEach((btn) => {
    btn.onclick = () => {
      const id = btn.getAttribute("data-del");
      const c = JSON.parse(JSON.stringify(state.catalog));
      const map = { vendor: "vendors", brandline: "brandLines", family: "famiglie", product: "prodotti", license: "licenze", source: "fonti" };
      const key = map[tab];
      const item = c[key].find((x) => x.id === id);
      c[key] = c[key].filter((x) => x.id !== id);
      logChange(c, tab, "eliminazione", item ? (item.nome || item.nomeUfficiale || item.nomeCommerciale || item.titolo) : id);
      persistCatalog(c, "eliminazione elemento " + tab);
    };
  });
  document.querySelectorAll("[data-del-af]").forEach((btn) => {
    btn.onclick = () => {
      const id = btn.getAttribute("data-del-af");
      const c = JSON.parse(JSON.stringify(state.catalog));
      c.areeFunzionali = c.areeFunzionali.filter((x) => x.id !== id);
      persistCatalog(c, "eliminazione area funzionale");
    };
  });

  const addBtn = document.getElementById("btn-add");
  if (addBtn) addBtn.onclick = () => addFromTab(tab);

  const addMacro = document.getElementById("btn-add-macro");
  if (addMacro) addMacro.onclick = () => {
    const nome = document.getElementById("ma-nome").value.trim();
    if (!nome) return showToast("Inserisci il nome della macroarea.");
    const c = JSON.parse(JSON.stringify(state.catalog));
    c.macroaree.push({ id: uid("ma"), nome, descrizione: document.getElementById("ma-desc").value.trim() });
    logChange(c, "MacroArea", "creazione", nome);
    persistCatalog(c, "nuova macroarea " + nome);
  };
  const addAf = document.getElementById("btn-add-af");
  if (addAf) addAf.onclick = () => {
    const nome = document.getElementById("af-nome").value.trim();
    if (!nome) return showToast("Inserisci il nome dell'area funzionale.");
    const c = JSON.parse(JSON.stringify(state.catalog));
    c.areeFunzionali.push({ id: uid("af"), nome, macroareaId: document.getElementById("af-macro").value });
    logChange(c, "FunctionalArea", "creazione", nome);
    persistCatalog(c, "nuova area funzionale " + nome);
  };
}

function addFromTab(tab) {
  const c = JSON.parse(JSON.stringify(state.catalog));
  const val = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };

  if (tab === "vendor") {
    const nome = val("f-nome"); if (!nome) return showToast("Inserisci il nome del vendor.");
    const v = { id: uid("v"), nome, sito: val("f-sito"), macroareeCoperte: [] };
    c.vendors.push(v); logChange(c, "Vendor", "creazione", nome);
  } else if (tab === "brandline") {
    const nome = val("f-nome"); if (!nome) return showToast("Inserisci il nome della brand line.");
    c.brandLines.push({ id: uid("bl"), vendorId: val("f-vendor"), nome, descrizione: val("f-desc") });
    logChange(c, "BrandLine", "creazione", nome);
  } else if (tab === "family") {
    const nome = val("f-nome"); if (!nome) return showToast("Inserisci il nome della famiglia.");
    c.famiglie.push({ id: uid("fam"), vendorId: val("f-vendor"), brandLineId: val("f-brandline") || null, macroareaId: val("f-macroarea"), areaFunzionaleId: val("f-areafunz") || null, nome, descrizione: val("f-desc"), stato: val("f-stato"), fonteId: null });
    logChange(c, "ProductFamily", "creazione", nome);
  } else if (tab === "product") {
    const nome = val("f-nome"); if (!nome) return showToast("Inserisci il nome commerciale.");
    c.prodotti.push({ id: uid("prod"), familyId: val("f-family"), nomeCommerciale: nome, modello: val("f-modello"), tipologia: val("f-tipologia"), deployment: val("f-deployment"), statoLifecycle: val("f-stato"), descrizioneBreve: val("f-desc").slice(0,300), fonteId: null });
    logChange(c, "Product", "creazione", nome);
  } else if (tab === "license") {
    const nome = val("f-nome"); if (!nome) return showToast("Inserisci il nome ufficiale della licenza.");
    c.licenze.push({ id: uid("lic"), familyId: val("f-family"), productIds: [], nomeUfficiale: nome, tipologia: val("f-tipologia"), metrica: val("f-metrica"), durata: val("f-durata"), rinnovo: val("f-rinnovo"), gracePeriod: val("f-grace"), conseguenzeScadenza: val("f-conseguenze"), fonteId: val("f-fonte") || null });
    logChange(c, "License", "creazione", nome);
  } else if (tab === "source") {
    const url = val("f-url"), titolo = val("f-nome"); if (!url || !titolo) return showToast("Compila URL e titolo della fonte.");
    c.fonti.push({ id: uid("src"), url, titolo, vendorId: val("f-vendor"), tipo: val("f-tipo"), dataConsultazione: val("f-data"), stato: "aggiornato", categoriaControllo: val("f-categoria") });
    logChange(c, "Source", "creazione", titolo);
  }
  persistCatalog(c, "nuovo elemento in " + tab);
}

function structuredSearchAnswer(question) {
  const q = question.toLowerCase();
  const c = state.catalog;
  const words = q.split(/\s+/).filter((w) => w.length > 2);
  const match = (s) => { s = (s||"").toLowerCase(); return words.some((w) => s.includes(w)); };

  const famiglie = c.famiglie.filter((f) => match(f.nome) || match(f.descrizione));
  const prodotti = c.prodotti.filter((p) => match(p.nomeCommerciale) || match(p.descrizioneBreve));
  const licenze = c.licenze.filter((l) => match(l.nomeUfficiale));
  const vendorIds = new Set([...famiglie.map(f=>f.vendorId), ...prodotti.map(p=>c.famiglie.find(f=>f.id===p.familyId)?.vendorId).filter(Boolean)]);

  if (!famiglie.length && !prodotti.length && !licenze.length) {
    return "Le informazioni disponibili non sono sufficienti per una raccomandazione definitiva.\n\nProva a citare il nome del vendor, della famiglia o del prodotto (es. \"FortiGate\", \"Catalyst\", \"Meraki\").";
  }

  const vendorNomi = [...vendorIds].map((id) => c.vendors.find(v=>v.id===id)?.nome).filter(Boolean);
  const lines = [];
  lines.push("Tecnologia applicabile: " + (famiglie.map(f=>f.nome).join(", ") || "n/d"));
  lines.push("Vendor: " + (vendorNomi.join(", ") || "n/d"));
  lines.push("Famiglie/prodotti pertinenti: " + [...famiglie.map(f=>f.nome), ...prodotti.map(p=>p.nomeCommerciale)].join(", "));
  lines.push("Licenze/subscription da valutare: " + (licenze.length ? licenze.map(l=>l.nomeUfficiale).join(", ") : "nessuna licenza specifica trovata per questa ricerca"));
  const fonti = [];
  famiglie.forEach((f) => f.fonteId && fonti.push(c.fonti.find(s=>s.id===f.fonteId)));
  prodotti.forEach((p) => p.fonteId && fonti.push(c.fonti.find(s=>s.id===p.fonteId)));
  licenze.forEach((l) => l.fonteId && fonti.push(c.fonti.find(s=>s.id===l.fonteId)));
  const fontiUniche = [...new Map(fonti.filter(Boolean).map(f=>[f.id,f])).values()];
  lines.push("Fonti: " + (fontiUniche.length ? fontiUniche.map(f=>f.url).join(" | ") : "DA VERIFICARE CON IL VENDOR"));
  lines.push("Data ultima verifica: " + (fontiUniche.length ? fontiUniche.map(f=>f.dataConsultazione).join(", ") : "n/d"));
  return lines.join("\n");
}

async function askAssistant() {
  const input = document.getElementById("assistant-input");
  const question = input.value.trim();
  if (!question) return;
  input.value = "";
  state.assistantMsgs.push({ role: "user", text: question });
  renderAssistantMsgs();

  if (!state.apiKey) {
    const answer = structuredSearchAnswer(question);
    state.assistantMsgs.push({ role: "bot", text: answer });
    renderAssistantMsgs();
    return;
  }

  state.assistantMsgs.push({ role: "bot", text: "Sto verificando i dati nel catalogo..." });
  renderAssistantMsgs();
  const context = JSON.stringify({
    macroaree: state.catalog.macroaree, vendors: state.catalog.vendors, brandLines: state.catalog.brandLines,
    famiglie: state.catalog.famiglie, prodotti: state.catalog.prodotti, licenze: state.catalog.licenze,
    licenseFeatures: state.catalog.licenseFeatures, integrazioni: state.catalog.integrazioni, fonti: state.catalog.fonti,
  });
  const systemPrompt = "Sei l'assistente interno del catalogo tecnologico Kaplet. Rispondi ESCLUSIVAMENTE usando i dati JSON forniti come contesto: non inventare prodotti, licenze, SKU, prezzi o funzionalita' non presenti. Se l'informazione richiesta non e' presente o e' insufficiente, rispondi esattamente: \"Le informazioni disponibili non sono sufficienti per una raccomandazione definitiva.\" e poi elenca quali domande servirebbero. Quando rispondi con dati presenti, struttura la risposta con: Tecnologia applicabile; Vendor; Famiglie/prodotti pertinenti; Licenze o subscription da valutare; Prerequisiti/limitazioni; Fonti; Data ultima verifica. Scrivi in italiano, in modo sintetico. Contesto dati (JSON):\n" + context;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": state.apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, system: systemPrompt, messages: [{ role: "user", content: question }] }),
    });
    const data = await res.json();
    state.assistantMsgs.pop(); // rimuove "sto verificando..."
    if (data.content) {
      const answer = data.content.filter((b)=>b.type==="text").map((b)=>b.text).join("\n").trim() || structuredSearchAnswer(question);
      state.assistantMsgs.push({ role: "bot", text: answer });
    } else {
      state.assistantMsgs.push({ role: "bot", text: "Errore dall'API Anthropic: " + (data.error?.message || JSON.stringify(data)) + "\n\nRisposta di riserva:\n" + structuredSearchAnswer(question) });
    }
  } catch (e) {
    state.assistantMsgs.pop();
    state.assistantMsgs.push({ role: "bot", text: "Errore di comunicazione con Anthropic. Risposta di riserva:\n" + structuredSearchAnswer(question) });
  }
  renderAssistantMsgs();
}

function renderAssistantMsgs() {
  const box = document.getElementById("assistant-msgs");
  box.innerHTML = state.assistantMsgs.map((m) => `<div class="${m.role==='user'?'msg-user':'msg-bot'}">${esc(m.text)}</div>`).join("");
  box.scrollTop = box.scrollHeight;
}

document.getElementById("assistant-input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); askAssistant(); } });

(async function init() {
  document.getElementById("content").innerHTML = `<div class="empty">Caricamento catalogo...</div>`;
  await loadInitialData();
  renderAssistantMsgs();
  render();
})();
</script>
</body>
